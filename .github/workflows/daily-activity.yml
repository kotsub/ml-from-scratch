name: Daily activity

on:
  schedule:
    # 09:17 UTC = 12:17 Europe/Moscow. GitHub may start scheduled jobs later.
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-activity.yml'
      - 'scripts/update_activity.py'

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  check-and-record:
    if: github.repository == 'kotsub/ml-from-scratch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Update daily log
        env:
          ACTIVITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/update_activity.py
      - name: Commit today's automated check-in
        shell: bash
        run: |
          git config user.name 'kotsub'
          git config user.email '172200019+kotsub@users.noreply.github.com'
          git add -- activity/README.md
          if git diff --cached --quiet; then
            echo 'An automated check-in for today is already recorded.'
            exit 0
          fi
          git commit -m 'chore(activity): record automated daily test run'
          git push origin HEAD:main
